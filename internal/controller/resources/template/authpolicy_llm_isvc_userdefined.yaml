apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: {{.TargetKind}}
    name: {{.TargetName}}
  # Named patterns single-source the positive regexes reused across rules.
  # API constraint: patterns are allOf of selector/operator/value (positive
  # `matches` only - no CEL, no OR, no negation), and a patternRef in `when`
  # cannot be negated. So negations stay as CEL predicates that reuse the SAME
  # regex value as the corresponding pattern, and the model-header path scope
  # (an OR) is expressed as `any: [patternRef, patternRef]`.
  patterns:
    has-ns-and-name:
      allOf:
        - selector: context.request.http.path
          operator: matches
          value: "^/[^/]+/[^/]+"
    is-short-path:
      allOf:
        - selector: context.request.http.path
          operator: matches
          value: "^/[^/]*/?$"
    is-publisher-path:
      allOf:
        - selector: context.request.http.path
          operator: matches
          value: "^/publishers/[^/]+/models/"
    is-model-api-root:
      allOf:
        - selector: context.request.http.path
          operator: matches
          value: "^/(v1|inference/v1)/"
    is-batch-path:
      allOf:
        - selector: context.request.http.path
          operator: matches
          value: "^/v1/(files|batches)($|/)"
    valid-model-header:
      allOf:
        - selector: "context.request.http.headers.{{.ModelRoutingHeader}}"
          operator: matches
          value: "^publishers/[^/]+/models/.+$"
    has-maas-user:
      allOf:
        - selector: context.request.http.headers.x-maas-user
          operator: matches
          value: ".+"
  rules:
    authentication:
      kubernetes-user:
        kubernetesTokenReview:
          audiences:
            - https://kubernetes.default.svc
        overrides:
          fairness:
            value: "https://kubernetes.default.svc"
          objective:
            expression: "auth.identity.user.username.startsWith('system:serviceaccount:') ? auth.identity.user.username.split(':')[2] : 'authenticated'"
          resolvedUser:
            expression: >-
              'x-maas-user' in request.headers
              ? request.headers['x-maas-user']
              : auth.identity.user.username
          resolvedGroups:
            expression: >-
              'x-maas-user' in request.headers
              ? ('x-maas-groups' in request.headers
                ? request.headers['x-maas-groups'].split(',')
                : [])
              : auth.identity.user.groups
    authorization:
      model-access-path:
        when:
          - patternRef: is-publisher-path
        kubernetesSubjectAccessReview:
          user:
            expression: "auth.identity.resolvedUser"
          authorizationGroups:
            expression: "auth.identity.resolvedGroups"
          resourceAttributes:
            group:
              value: serving.opendatahub.io
            resource:
              value: models
            namespace:
              expression: "request.path.split('/')[2]"
            # Model name: everything between /models/ and the first /v1/ segment.
            # Supports multi-segment names (e.g. facebook/opt-125m). Model names
            # containing a literal /v1/ segment are not supported - same limitation
            # as the kserve HTTPRoute template which uses /v1/ as the API path delimiter.
            name:
              expression: >-
                'publishers/'
                + request.path.split('/')[2]
                + '/models/'
                + request.path.split('/models/')[1].split('/v1/')[0]
            verb:
              value: post
        priority: 1
      model-access-path-delegate:
        when:
          - patternRef: is-publisher-path
          - patternRef: has-maas-user
        kubernetesSubjectAccessReview:
          user:
            expression: "auth.identity.user.username"
          authorizationGroups:
            expression: "auth.identity.user.groups"
          resourceAttributes:
            group:
              value: serving.opendatahub.io
            resource:
              value: models/delegate
            namespace:
              expression: "request.path.split('/')[2]"
            name:
              expression: >-
                'publishers/'
                + request.path.split('/')[2]
                + '/models/'
                + request.path.split('/models/')[1].split('/v1/')[0]
            verb:
              value: post-delegate
        priority: 1
      # Model-based routing: the kserve HTTPRoute (v1-model-routing and
      # v1-catch-all-model-routing) dispatches requests carrying a valid model
      # routing header (publishers/<ns>/models/<name>) by header - not by path -
      # to the target InferencePool / workload Service. This applies on paths
      # that are neither publisher paths (authorized by model-access-path) nor
      # batch API paths. Authorize against the SAME value used for routing: the
      # namespace and model name are taken from the header, so authorization and
      # routing cannot diverge across tenants.
      model-access-header:
        when:
          # ¬is-publisher-path (covered by model-access-path); regex mirrors that pattern.
          - predicate: >-
              !request.path.matches('^/publishers/[^/]+/models/')
          # ¬is-batch-path (batch paths are authn-only); regex mirrors that pattern.
          - predicate: >-
              !request.path.matches('^/v1/(files|batches)($|/)')
          # Not a per-participant path (/<ns>/<name>/...). Those route by path
          # (path-prefix beats header-only in Gateway API precedence), so the
          # header is inert and inference-access authorizes them via get on the
          # LLMInferenceService. Header routing applies to model-API roots
          # (is-model-api-root: /v1/ chat/completions, completions, responses,
          # messages, ...; /inference/v1/ generate) and single-segment / catch-all
          # paths (is-short-path: /tokenize, /detokenize, /health, ...).
          - any:
              - patternRef: is-model-api-root
              - patternRef: is-short-path
          - patternRef: valid-model-header
        kubernetesSubjectAccessReview:
          user:
            expression: "auth.identity.resolvedUser"
          authorizationGroups:
            expression: "auth.identity.resolvedGroups"
          resourceAttributes:
            group:
              value: serving.opendatahub.io
            resource:
              value: models
            # Header value is already publishers/<ns>/models/<name>, matching the
            # resource name that model-access-path reconstructs from the path.
            namespace:
              expression: "request.headers['{{.ModelRoutingHeader}}'].split('/')[1]"
            name:
              expression: "request.headers['{{.ModelRoutingHeader}}']"
            verb:
              value: post
        priority: 1
      model-access-header-delegate:
        when:
          # Same scope as model-access-header (see comments there) + delegation marker.
          - predicate: >-
              !request.path.matches('^/publishers/[^/]+/models/')
          - predicate: >-
              !request.path.matches('^/v1/(files|batches)($|/)')
          - any:
              - patternRef: is-model-api-root
              - patternRef: is-short-path
          - patternRef: valid-model-header
          - patternRef: has-maas-user
        kubernetesSubjectAccessReview:
          user:
            expression: "auth.identity.user.username"
          authorizationGroups:
            expression: "auth.identity.user.groups"
          resourceAttributes:
            group:
              value: serving.opendatahub.io
            resource:
              value: models/delegate
            namespace:
              expression: "request.headers['{{.ModelRoutingHeader}}'].split('/')[1]"
            name:
              expression: "request.headers['{{.ModelRoutingHeader}}']"
            verb:
              value: post-delegate
        priority: 1
      inference-access:
        when:
          - patternRef: has-ns-and-name
          # ¬is-model-api-root: exclude model-API roots so their 2nd/3rd segments
          # (e.g. /inference/v1/generate -> ns=inference/name=v1) are not mistaken
          # for a per-participant <ns>/<name>. Regex mirrors the is-model-api-root pattern.
          - predicate: >-
              !request.path.matches('^/(v1|inference/v1)/')
          # ¬is-publisher-path; regex mirrors that pattern.
          - predicate: >-
              !request.path.matches('^/publishers/[^/]+/models/')
        kubernetesSubjectAccessReview:
          user:
            expression: "auth.identity.resolvedUser"
          authorizationGroups:
            expression: "auth.identity.resolvedGroups"
          resourceAttributes:
            group:
              value: serving.kserve.io
            resource:
              value: llminferenceservices
            namespace:
              expression: request.path.split("/")[1]
            name:
              expression: request.path.split("/")[2]
            verb:
              value: get
        priority: 1
      inference-access-delegate:
        when:
          - patternRef: has-ns-and-name
          # See inference-access: exclude model-API roots from per-participant matching.
          - predicate: >-
              !request.path.matches('^/(v1|inference/v1)/')
          - predicate: >-
              !request.path.matches('^/publishers/[^/]+/models/')
          - patternRef: has-maas-user
        kubernetesSubjectAccessReview:
          user:
            expression: "auth.identity.user.username"
          authorizationGroups:
            expression: "auth.identity.user.groups"
          resourceAttributes:
            group:
              value: serving.kserve.io
            resource:
              value: llminferenceservices/delegate
            namespace:
              expression: request.path.split("/")[1]
            name:
              expression: request.path.split("/")[2]
            verb:
              value: post-delegate
        priority: 1
    response:
      success:
        headers:
          x-gateway-inference-fairness-id:
            metrics: false
            plain:
              expression: auth.identity.fairness
            priority: 0
          x-gateway-inference-objective:
            metrics: false
            plain:
              expression: auth.identity.objective
            priority: 0
          x-maas-user:
            when:
              - patternRef: is-batch-path
            plain:
              expression: auth.identity.user.username
            priority: 0
          x-maas-groups:
            when:
              - patternRef: is-batch-path
            plain:
              expression: "auth.identity.user.groups.join(',')"
            priority: 0
          x-user-id:
            when:
              - predicate: "request.path.startsWith('/v1/')"
            plain:
              expression: auth.identity.user.username
            priority: 0
          x-tenant-id:
            when:
              - predicate: "request.path.startsWith('/v1/')"
            plain:
              expression: "auth.identity.user.username.startsWith('system:serviceaccount:') ? auth.identity.user.username.split(':')[2] : 'default'"
            priority: 0
