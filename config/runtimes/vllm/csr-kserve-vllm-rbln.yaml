apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: csr-kserve-vllm-rbln
  labels:
    opendatahub.io/managed: "true"
    opendatahub.io/dashboard: "true"
    opendatahub.io/ootb: "true"
  annotations:
    opendatahub.io/version: "1.0.0"
    opendatahub.io/template-display-name: "vLLM"
    opendatahub.io/runtime-version: "TBD"
    opendatahub.io/recommended-accelerators: '["rebellions.ai/npu"]'
    openshift.io/display-name: vLLM Rebellions RBLN NPU ServingRuntime for KServe
spec:
  annotations:
    opendatahub.io/kserve-runtime: "vllm"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  multiModel: false
  supportedModelFormats:
    - autoSelect: false
      name: vLLM
  builtInAdapter:
    modelLoadingTimeoutMillis: 90000
  containers:
    - name: kserve-container
      image: $(vllm-rbln-image)
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name={{.Name}}"
        - "--enable-chunked-prefill"
        - "--model-impl=vllm"
      env:
        # vllm-rbln writes its NPU compile cache under $HOME.
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp/hf_home
        # The first start compiles the model for the NPU, which can take over an hour.
        - name: VLLM_ENGINE_READY_TIMEOUT_S
          value: "9600"
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
