apiVersion: template.openshift.io/v1
kind: Template
metadata:
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/ootb: 'true'
  annotations:
    description: vLLM ServingRuntime to support Rebellions RBLN NPUs
    openshift.io/display-name: vLLM Rebellions RBLN NPU ServingRuntime for KServe
    openshift.io/provider-display-name: Red Hat, Inc.
    tags: rhods,rhoai,kserve,servingruntime
    template.openshift.io/documentation-url: https://github.com/rebellions-sw/vllm-rbln
    template.openshift.io/long-description: This template defines resources needed to deploy vLLM Rebellions RBLN NPU ServingRuntime with KServe in Red Hat OpenShift AI
    opendatahub.io/modelServingSupport: '["single"]'
    opendatahub.io/apiProtocol: 'REST'
    opendatahub.io/model-type: '["generative"]'
  name: vllm-rbln-runtime-template
objects:
  - apiVersion: serving.kserve.io/v1alpha1
    kind: ServingRuntime
    metadata:
      name: vllm-rbln-runtime
      annotations:
        openshift.io/display-name: vLLM Rebellions RBLN NPU ServingRuntime for KServe
        opendatahub.io/recommended-accelerators: '["rebellions.ai/npu"]'
        opendatahub.io/runtime-version: 'TBD'
      labels:
        opendatahub.io/dashboard: 'true'
    spec:
      annotations:
        opendatahub.io/kserve-runtime: 'vllm'
        prometheus.io/port: '8080'
        prometheus.io/path: '/metrics'
      multiModel: false
      supportedModelFormats:
        - autoSelect: false
          name: vLLM
      builtInAdapter:
        modelLoadingTimeoutMillis: 90000
      containers:
        - name: kserve-container
          image: $(vllm-rbln-image)
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - "--port=8080"
            - "--model=/mnt/models"
            - "--served-model-name={{.Name}}"
            - "--enable-chunked-prefill"
            - "--model-impl=vllm"
          env:
            # vllm-rbln writes its NPU compile cache under $HOME.
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/hf_home
            # The first start compiles the model for the NPU, which can take over an hour.
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "9600"
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
