apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: odh-model-controller-webhook-allow-ingress
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: odh-model-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow API-server webhooks and kubelet probes from host-network sources.
    # Omit the peer podSelector: OVN needs the special namespace address set,
    # not an empty pod address set for the synthetic host-network namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
      ports:
        - protocol: TCP
          port: 9443
        - protocol: TCP
          port: 8081
    # Admit metrics scrapers from OpenShift's monitoring namespace group.
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8443
  # The manager needs Kubernetes API and DNS access, and may contact dynamic
  # NIM and Model Registry endpoints. Keep egress explicitly open until those
  # external destinations can be represented safely by narrower peers.
  egress:
    - {}
