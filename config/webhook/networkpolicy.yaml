apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: odh-model-controller-webhook-allow-ingress
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: odh-model-controller
  ingress:
    - ports:
        - protocol: TCP
          port: 9443
  policyTypes:
    - Ingress
