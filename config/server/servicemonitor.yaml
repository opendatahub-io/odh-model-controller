apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: model-serving-api-metrics
  namespace: system
  labels:
    app: model-serving-api
spec:
  endpoints:
    - path: /metrics
      port: metrics
      scheme: https
      tlsConfig:
        ca:
          configMap:
            name: openshift-service-ca.crt
            key: service-ca.crt
        serverName: model-serving-api.NAMESPACE.svc
  selector:
    matchLabels:
      app.kubernetes.io/name: model-serving-api
