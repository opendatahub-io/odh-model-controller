# Local transport smoke backend; the Serverless e2e uses real model workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: authconfig-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
        component: predictor
        test.opendatahub.io/authconfig-groups: "true"
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/interceptionMode: NONE
    spec:
      containers:
        - name: echo
          image: docker.io/ealen/echo-server:0.9.2@sha256:006b92e1d6682442e29d1d0d73c34a61166d42f8a5bf1ea10c318f07ad4790e2
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: authconfig-e2e
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 8080
      targetPort: 8081
---
# Route explicitly through the inbound sidecar listener. This keeps the local
# transport test independent of the host kernel's legacy iptables modules.
apiVersion: networking.istio.io/v1alpha3
kind: Sidecar
metadata:
  name: echo
  namespace: authconfig-e2e
spec:
  workloadSelector:
    labels:
      app: echo
  ingress:
    - port:
        number: 8081
        name: http
        protocol: HTTP
      captureMode: NONE
      defaultEndpoint: 127.0.0.1:8080
  egress:
    - hosts:
        - ./authorino-authorino-authorization.authconfig-e2e.svc.cluster.local
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: authconfig-gateway
  namespace: authconfig-e2e
spec:
  selector:
    istio: authconfig-gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts: ["*.example.test"]
